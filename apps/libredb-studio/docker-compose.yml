# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/LibreDBStudio).
services:
  libredb-studio:
    image: libredb/libredb-studio:1.2.0
    environment:
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: ''
      JWT_SECRET: ''
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      AUTH_COOKIE_SECURE: 'false'
    volumes:
    - ${APP_DATA_DIR}/data/data:/app/data
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://127.0.0.1:3000/api/db/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M
    privileged: false
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
