# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Vivaldi).
services:
  vivaldi:
    image: linuxserver/vivaldi:8.3.4191
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      VIVALDI_CLI: ''
    ports:
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    shm_size: 1gb
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
