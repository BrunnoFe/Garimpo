# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Chrome).
services:
  chrome:
    image: linuxserver/chrome:157.0.8103
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CHROME_CLI: ''
    ports:
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
