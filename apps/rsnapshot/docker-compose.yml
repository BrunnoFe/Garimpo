# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Rsnapshot).
services:
  rsnapshot:
    image: linuxserver/rsnapshot:1.4.5
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/.snapshots:/.snapshots
    - ${APP_DATA_DIR}/data/data:/data
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
