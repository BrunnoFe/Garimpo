# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Karakeep).
services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    deploy:
      resources:
        reservations:
          memory: 512M
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DATA_DIR: /data
      NEXTAUTH_URL: http://localhost:14592
      NEXTAUTH_SECRET: ${GARIMPO_SEGREDO_1}
      MEILI_MASTER_KEY: ${GARIMPO_SEGREDO_1}
      OPENAI_API_KEY: ''
    x-runtipi:
      is_main: true
      internal_port: 3000
  karakeep-chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    deploy:
      resources:
        reservations:
          memory: 512M
    init: true
    command:
    - --disable-gpu
    - --disable-dev-shm-usage
    - --hide-scrollbars
    - --disable-blink-features=AutomationControlled
    - --window-size=1440,900
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.41.0
    deploy:
      resources:
        reservations:
          memory: 256M
    volumes:
    - ${APP_DATA_DIR}/data/meilisearch:/meili_data
    environment:
      MEILI_MASTER_KEY: ${GARIMPO_SEGREDO_1}
      MEILI_NO_ANALYTICS: 'true'
x-runtipi:
  schema_version: 2
