# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Blinko).
services:
  blinko:
    image: blinkospace/blinko:1.8.7
    depends_on:
      blinko-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:1111
      NEXT_PUBLIC_BASE_URL: http://localhost:1111
      NEXTAUTH_SECRET: ${GARIMPO_SEGREDO_1}
      DATABASE_URL: postgresql://postgres:${GARIMPO_SEGREDO_2}@blinko-postgres:5432/postgres
    volumes:
    - ${APP_DATA_DIR}/data/blinko_data:/app/.blinko
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        reservations:
          memory: 512m
    x-runtipi:
      is_main: true
      internal_port: 1111
  blinko-postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GARIMPO_SEGREDO_2}
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          memory: 256m
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      - -d
      - postgres
      interval: 5s
      timeout: 10s
      retries: 5
x-runtipi:
  schema_version: 2
