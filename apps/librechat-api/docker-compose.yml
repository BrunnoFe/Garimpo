# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/LibreChat).
services:
  librechat-api:
    depends_on:
    - librechat-mongodb
    - librechat-rag-api
    image: ghcr.io/danny-avila/librechat-dev:latest
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
    - ASSISTANTS_API_KEY=user_provided
    - OPENAI_API_KEY=user_provided
    - GOOGLE_KEY=user_provided
    - ANTHROPIC_API_KEY=user_provided
    - HOST=0.0.0.0
    - PORT=3080
    - DOMAIN_CLIENT=http://0.0.0.0:3080
    - DOMAIN_SERVER=http://0.0.0.0:3080
    - NO_INDEX=true
    - TRUST_PROXY=1
    - CONSOLE_JSON=false
    - DEBUG_LOGGING=true
    - DEBUG_CONSOLE=false
    - MONGO_URI=mongodb://librechat-mongodb:27017/LibreChat
    - MEILI_HOST=http://librechat-meilisearch:7700
    - RAG_PORT=8000
    - RAG_API_URL=http://librechat-rag-api:8000
    - SEARCH=true
    - MEILI_NO_ANALYTICS=true
    - OPENAI_MODERATION=false
    - BAN_VIOLATIONS=true
    - BAN_DURATION=1000 * 60 * 60 * 2
    - BAN_INTERVAL=20
    - LOGIN_VIOLATION_SCORE=1
    - REGISTRATION_VIOLATION_SCORE=1
    - CONCURRENT_VIOLATION_SCORE=1
    - MESSAGE_VIOLATION_SCORE=1
    - NON_BROWSER_VIOLATION_SCORE=20
    - TTS_VIOLATION_SCORE=0
    - STT_VIOLATION_SCORE=0
    - FORK_VIOLATION_SCORE=0
    - IMPORT_VIOLATION_SCORE=0
    - FILE_UPLOAD_VIOLATION_SCORE=0
    - LOGIN_MAX=7
    - LOGIN_WINDOW=5
    - REGISTER_MAX=5
    - REGISTER_WINDOW=60
    - LIMIT_CONCURRENT_MESSAGES=true
    - CONCURRENT_MESSAGE_MAX=2
    - LIMIT_MESSAGE_IP=true
    - MESSAGE_IP_MAX=40
    - MESSAGE_IP_WINDOW=1
    - LIMIT_MESSAGE_USER=false
    - MESSAGE_USER_MAX=40
    - MESSAGE_USER_WINDOW=1
    - ILLEGAL_MODEL_REQ_SCORE=5
    - ALLOW_EMAIL_LOGIN=true
    - ALLOW_REGISTRATION=true
    - ALLOW_SOCIAL_LOGIN=false
    - ALLOW_SOCIAL_REGISTRATION=false
    - ALLOW_PASSWORD_RESET=false
    - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
    - SESSION_EXPIRY=1000 * 60 * 15
    - REFRESH_TOKEN_EXPIRY=(1000 * 60 * 60 * 24) * 7
    - JWT_SECRET=${GARIMPO_SEGREDO_1}
    - JWT_REFRESH_SECRET=${GARIMPO_SEGREDO_2}
    - CREDS_KEY=${GARIMPO_SEGREDO_3}
    - CREDS_IV=e2341419ec3dd3d19b13a1a87fafcbfb
    - DEBUG_PLUGINS=true
    - DEBUG_OPENAI=false
    volumes:
    - ${APP_DATA_DIR}/data/images:/app/client/public/images
    - ${APP_DATA_DIR}/data/uploads:/app/uploads
    - ${APP_DATA_DIR}/data/logs:/app/api/logs
    deploy:
      resources:
        reservations:
          memory: 1024M
    x-runtipi:
      is_main: true
      internal_port: 3080
  librechat-mongodb:
    image: mongo:6.0
    volumes:
    - ${APP_DATA_DIR}/data/data-node:/data/db
    command:
    - mongod
    - --noauth
    deploy:
      resources:
        reservations:
          memory: 1024M
  librechat-meilisearch:
    image: getmeili/meilisearch:v1.12.3
    user: 1000:1000
    environment:
    - MEILI_HOST=http://librechat-meilisearch:7700
    - MEILI_NO_ANALYTICS=true
    - MEILI_MASTER_KEY=${GARIMPO_SEGREDO_4}
    volumes:
    - ${APP_DATA_DIR}/data/meili_data_v1.12:/meili_data
  librechat-vectordb:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
    - ${APP_DATA_DIR}/data/postgresql/data:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          memory: 500M
  librechat-rag-api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.6.0
    environment:
    - DB_HOST=librechat-vectordb
    - RAG_PORT=8000
    depends_on:
    - librechat-vectordb
    deploy:
      resources:
        reservations:
          memory: 1024M
x-runtipi:
  schema_version: 2
