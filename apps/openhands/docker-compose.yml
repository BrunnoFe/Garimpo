# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/OpenHands).
services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.59
    environment:
    - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main-nikolaik
    - WORKSPACE_MOUNT_PATH=/DATA/AppData/openhands/workspace
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/data/openhands:/.openhands
    - ${APP_DATA_DIR}/data/workspace:/opt/workspace_base
    stdin_open: true
    tty: true
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
