# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/PyLoad).
services:
  pyload:
    image: linuxserver/pyload-ng:0.5.0
    deploy:
      resources:
        reservations:
          memory: 256M
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    privileged: false
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${ROOT_FOLDER_HOST}/media/downloads:/downloads
    ports:
    - target: 9666
      published: '9666'
      protocol: tcp
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
