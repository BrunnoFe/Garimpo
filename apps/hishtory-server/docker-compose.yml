# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Hishtory-server).
services:
  hishtory-server:
    image: linuxserver/hishtory-server:0.335.20261120
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
