# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/dispatcharr).
services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.29.0
    deploy:
      resources:
        reservations:
          memory: 512M
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    environment:
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    x-runtipi:
      is_main: true
      internal_port: 9191
x-runtipi:
  schema_version: 2
