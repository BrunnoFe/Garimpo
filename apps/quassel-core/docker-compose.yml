# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Quassel-core).
services:
  quassel-core:
    image: linuxserver/quassel-core:0.14.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      RUN_OPTS: ''
    ports:
    - target: 113
      published: 10113
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 4242
x-runtipi:
  schema_version: 2
