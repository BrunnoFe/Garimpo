# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Medusa).
services:
  medusa:
    deploy:
      resources:
        limits:
          memory: 7848M
    environment:
    - TZ= ${TZ}
    image: pymedusa/medusa:master
    volumes:
    - ${APP_DATA_DIR}/data:/config
    - ${APP_DATA_DIR}/data/Downloads/Television:/downloads
    - ${APP_DATA_DIR}/data/Media/Television:/tv
    privileged: false
    x-runtipi:
      is_main: true
      internal_port: 8081
x-runtipi:
  schema_version: 2
