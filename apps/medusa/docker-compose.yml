# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Medusa).
services:
  medusa:
    image: linuxserver/medusa:1.0.27
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/tv:/tv
    x-runtipi:
      is_main: true
      internal_port: 8081
x-runtipi:
  schema_version: 2
