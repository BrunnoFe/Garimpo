# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Fleet).
services:
  fleet:
    image: linuxserver/fleet:2.3.3
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      fleet_admin_authentication_type: ''
      fleet_database_url: ''
      fleet_database_username: ''
      fleet_database_password: ''
      fleet_admin_secret: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
