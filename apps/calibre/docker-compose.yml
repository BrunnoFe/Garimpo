# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Calibre).
services:
  calibre:
    image: linuxserver/calibre:9.19.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PASSWORD: ''
      CLI_ARGS: ''
    ports:
    - target: 8181
      published: 8181
      protocol: tcp
    - target: 8081
      published: 8081
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    shm_size: 1gb
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
