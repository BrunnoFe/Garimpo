# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/ConvertX).
services:
  convertx:
    image: c4illin/convertx:v0.17.0
    deploy:
      resources:
        reservations:
          memory: 500M
    environment:
    - JWT_SECRET=${GARIMPO_SEGREDO_1}
    - HTTP_ALLOWED=true
    volumes:
    - ${APP_DATA_DIR}/data/data:/app/data
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
