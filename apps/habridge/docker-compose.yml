# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Habridge).
services:
  habridge:
    image: linuxserver/habridge:5.4.1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      SEC_KEY: ''
    ports:
    - target: 50000
      published: 50000
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
