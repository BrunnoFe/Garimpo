# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Overseerr).
services:
  overseerr:
    image: linuxserver/overseerr:1.33.2
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 5055
x-runtipi:
  schema_version: 2
