# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Teable).
services:
  teable:
    image: teableio/teable:latest
    deploy:
      resources:
        reservations:
          memory: 512M
    volumes:
    - ${APP_DATA_DIR}/data/assets:/app/.assets
    environment:
    - TZ=${TZ}
    - NEXT_ENV_IMAGES_ALL_REMOTE=true
    - PUBLIC_ORIGIN=http://127.0.0.1:3000
    - PRISMA_DATABASE_URL=postgresql://example:example@teable-db:5432/teable-db
    - BACKEND_CACHE_PROVIDER=redis
    - BACKEND_CACHE_REDIS_URI=redis://default:password@teable-cache:6379/0
    depends_on:
      teable-db:
        condition: service_healthy
      teable-cache:
        condition: service_healthy
    x-runtipi:
      is_main: true
      internal_port: 3000
  teable-db:
    image: postgres:15
    deploy:
      resources:
        reservations:
          memory: 256M
    volumes:
    - ${APP_DATA_DIR}/data/data:/var/lib/postgresql/data
    environment:
    - TZ=${TZ}
    - POSTGRES_DB=teable-db
    - POSTGRES_USER=example
    - POSTGRES_PASSWORD=example
    healthcheck:
      test:
      - CMD-SHELL
      - sh -c 'pg_isready -U example -d teable-db'
      interval: 10s
      timeout: 3s
      retries: 3
  teable-cache:
    image: redis:7.2.4
    deploy:
      resources:
        reservations:
          memory: 256M
    expose:
    - '6379'
    volumes:
    - ${APP_DATA_DIR}/data/teable-cache-data:/data
    command:
    - redis-server
    - --requirepass password
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 10s
      timeout: 3s
      retries: 3
x-runtipi:
  schema_version: 2
