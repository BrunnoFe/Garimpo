# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Pydio-cells).
services:
  pydio-cells:
    image: linuxserver/pydio-cells:5.1.1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      EXTERNALURL: ''
      SERVER_IP: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
