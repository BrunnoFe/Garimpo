# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Kasm).
services:
  kasm:
    image: linuxserver/kasm:1.19.0
    environment:
      KASM_PORT: ''
      KASM_SETUP: ''
      DOCKER_HUB_USERNAME: ''
      DOCKER_HUB_PASSWORD: ''
      DOCKER_MTU: ''
    volumes:
    - ${APP_DATA_DIR}/data/opt:/opt
    - ${APP_DATA_DIR}/data/profiles:/profiles
    - /dev/input:/dev/input
    - /run/udev/data:/run/udev/data
    x-runtipi:
      is_main: true
      internal_port: 443
x-runtipi:
  schema_version: 2
