# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Ldap-auth).
services:
  ldap-auth:
    image: linuxserver/ldap-auth:3.4.8
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    ports:
    - target: 9000
      published: 9000
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8888
x-runtipi:
  schema_version: 2
