# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/DeepSeek-OCR_Nvidia).
services:
  deepseek-ocr-frontend:
    image: icewhaletech/deepseek-ocr-frontend:v2.2.0
    deploy:
      resources:
        reservations:
          memory: 512M
    depends_on:
    - deepseek-ocr-backend
    x-runtipi:
      is_main: true
      internal_port: 80
  deepseek-ocr-backend:
    image: icewhaletech/deepseek-ocr-backend:v2.2.0
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '8000'
      FRONTEND_PORT: '3000'
      MODEL_NAME: deepseek-ai/DeepSeek-OCR
      HF_HOME: /models
      MAX_UPLOAD_SIZE_MB: '100'
      BASE_SIZE: '1024'
      IMAGE_SIZE: '640'
      CROP_MODE: 'true'
    volumes:
    - ${APP_DATA_DIR}/data/models:/models
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
          memory: 8G
    shm_size: 4g
    ports:
    - target: 8000
      published: '22523'
      protocol: tcp
x-runtipi:
  schema_version: 2
