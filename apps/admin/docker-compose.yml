# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/ProjectNOMAD).
services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:1.35.1
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      URL: http://localhost:8080
      LOG_LEVEL: info
      APP_KEY: ${GARIMPO_SEGREDO_1}
      NOMAD_STORAGE_PATH: /DATA/AppData/admin/storage
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: nomad
      DB_USER: nomad_user
      DB_PASSWORD: ${GARIMPO_SEGREDO_2}
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DISABLE_COMPRESSION: 'false'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/storage:/app/storage
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          memory: 512M
    x-runtipi:
      is_main: true
      internal_port: 8080
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_ROOT_PASSWORD: ${GARIMPO_SEGREDO_3}
      MYSQL_DATABASE: nomad
      MYSQL_USER: nomad_user
      MYSQL_PASSWORD: ${GARIMPO_SEGREDO_2}
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          memory: 512M
  redis:
    image: redis:7.4.8-alpine
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          memory: 64M
  dozzle:
    image: amir20/dozzle:v10.0.7
    environment:
      DOZZLE_ENABLE_ACTIONS: 'false'
      DOZZLE_ENABLE_SHELL: 'false'
    ports:
    - target: 8080
      published: '9999'
      protocol: tcp
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  disk-collector:
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    volumes:
    - /:/host:ro
    - ${APP_DATA_DIR}/data/storage:/storage
x-runtipi:
  schema_version: 2
