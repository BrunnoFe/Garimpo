# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Hermes).
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.6.5
    deploy:
      resources:
        reservations:
          memory: 1G
    command:
    - gateway
    - run
    ports:
    - target: 8642
      published: '8642'
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data:/opt/data
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_INSECURE: 1
    x-runtipi:
      is_main: true
      internal_port: 9119
x-runtipi:
  schema_version: 2
