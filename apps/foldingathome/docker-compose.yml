# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Foldingathome).
services:
  foldingathome:
    image: linuxserver/foldingathome:8.5.6
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      ACCOUNT_TOKEN: ''
      MACHINE_NAME: ''
      CLI_ARGS: ''
    ports:
    - target: 7396
      published: 7396
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
