# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Sure).
services:
  sure-web:
    image: ghcr.io/we-promise/sure:0.6.5-hotfix.1
    volumes:
    - ${APP_DATA_DIR}/data/app/storage:/rails/storage
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_production
      SECRET_KEY_BASE: ${GARIMPO_SEGREDO_1}
      SELF_HOSTED: 'true'
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      DB_HOST: sure-db
      DB_PORT: 5432
      REDIS_URL: redis://sure-redis:6379/1
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 1024M
    x-runtipi:
      is_main: true
      internal_port: 3000
  sure-worker:
    image: ghcr.io/we-promise/sure:0.6.5-hotfix.1
    command:
    - bundle
    - exec
    - sidekiq
    volumes:
    - ${APP_DATA_DIR}/data/app/storage:/rails/storage
    depends_on:
      sure-redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_production
      SECRET_KEY_BASE: ${GARIMPO_SEGREDO_1}
      SELF_HOSTED: 'true'
      RAILS_FORCE_SSL: 'false'
      RAILS_ASSUME_SSL: 'false'
      DB_HOST: sure-db
      DB_PORT: 5432
      REDIS_URL: redis://sure-redis:6379/1
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
    deploy:
      resources:
        reservations:
          memory: 1024M
  sure-db:
    image: postgres:16
    volumes:
    - ${APP_DATA_DIR}/data/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sure_user
      POSTGRES_PASSWORD: sure_password
      POSTGRES_DB: sure_production
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sure_user -d sure_production
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          memory: 1024M
  sure-redis:
    image: redis:8.2.1-alpine3.22
    volumes:
    - ${APP_DATA_DIR}/data/redis/data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          memory: 1024M
x-runtipi:
  schema_version: 2
