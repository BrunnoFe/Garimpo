# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Vscodium-web).
services:
  vscodium-web:
    image: linuxserver/vscodium-web:1.143.17232
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
