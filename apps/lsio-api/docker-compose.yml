# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Lsio-api).
services:
  lsio-api:
    image: linuxserver/lsio-api:version-9eda67ec
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
