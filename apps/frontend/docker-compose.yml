# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Clumoove).
services:
  frontend:
    image: ghcr.io/xxroxxerxx/clumoove-frontend:v0.19.0
    environment:
    - CLUMOOVE_API_URL=
    depends_on:
    - api-backend
    x-runtipi:
      is_main: true
      internal_port: 3000
  api-backend:
    image: ghcr.io/xxroxxerxx/clumoove-api:v0.19.0@sha256:d5a30c51c5ac6684e6afc399ca5ab845338bc06ab14cc3873bdbd52e2d3478cf
    environment:
    - DATABASE_URL=postgres://clumoove:${GARIMPO_SEGREDO_3}@postgres-db:5432/cloud_migration_db?sslmode=disable
    - REDIS_URL=redis://:clumoove_secure_redis_pass@redis-queue:6379
    - PORT=8000
    - ENCRYPTION_SECRET_KEY=${GARIMPO_SEGREDO_1}
    - JWT_SECRET_KEY=${GARIMPO_SEGREDO_2}
    - TRUSTED_PROXY=1
    - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
    - ${APP_DATA_DIR}/data/storage:/clumoove
    depends_on:
    - postgres-db
    - redis-queue
  migration-worker:
    image: ghcr.io/xxroxxerxx/clumoove-worker:v0.19.0@sha256:680ba9935621eb032b6abd5d0d25472eddd2738222f35778fce86914d6a47662
    command:
    - /app/worker
    environment:
    - DATABASE_URL=postgres://clumoove:${GARIMPO_SEGREDO_3}@postgres-db:5432/cloud_migration_db?sslmode=disable
    - REDIS_URL=redis://:clumoove_secure_redis_pass@redis-queue:6379
    - ENCRYPTION_SECRET_KEY=${GARIMPO_SEGREDO_1}
    - LOCAL_STORAGE_ROOT=/clumoove
    volumes:
    - ${APP_DATA_DIR}/data/storage:/clumoove
    depends_on:
    - postgres-db
    - redis-queue
  postgres-db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    command:
    - postgres
    - -c
    - max_connections=300
    environment:
      POSTGRES_USER: clumoove
      POSTGRES_PASSWORD: ${GARIMPO_SEGREDO_3}
      POSTGRES_DB: cloud_migration_db
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
  redis-queue:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes --requirepass "clumoove_secure_redis_pass" --bind 0.0.0.0
    volumes:
    - ${APP_DATA_DIR}/data/redis:/data
x-runtipi:
  schema_version: 2
