# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/nzbfast).
services:
  nzbfast:
    image: nzbfast/nzbfast:1.3.1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      NZBFAST_APIKEY: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/watch:/watch
    - ${ROOT_FOLDER_HOST}/media/downloads:/downloads
    deploy:
      resources:
        reservations:
          memory: 128M
    x-runtipi:
      is_main: true
      internal_port: 6789
x-runtipi:
  schema_version: 2
