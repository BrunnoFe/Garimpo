# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Threadfin).
services:
  threadfin:
    image: fyb3roptik/threadfin:1.2.37
    environment:
    - THREADFIN_BRANCH=main
    - THREADFIN_DEBUG=0
    volumes:
    - ${APP_DATA_DIR}/data/config:/home/threadfin/conf/data
    - ${APP_DATA_DIR}/data/backup:/home/threadfin/conf/backup
    x-runtipi:
      is_main: true
      internal_port: 34400
x-runtipi:
  schema_version: 2
