# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Pylon).
services:
  pylon:
    image: linuxserver/pylon:2.10.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      GITURL: ''
      PYUSER: ''
      PYPASS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/code:/code
    x-runtipi:
      is_main: true
      internal_port: 3131
x-runtipi:
  schema_version: 2
