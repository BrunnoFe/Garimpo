# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/HFS).
services:
  hfs:
    image: rejetto/hfs:v3.3.4
    environment:
      HFS_PORT: '80'
      HFS_INITIAL_ADMIN_PASSWORD: ${HFS_INITIAL_ADMIN_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/config:/data
    - ${APP_DATA_DIR}/data/shares:/shares
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
