# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Apprise-api).
services:
  apprise-api:
    image: linuxserver/apprise-api:2.1.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APPRISE_ATTACH_SIZE: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/attachments:/attachments
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
