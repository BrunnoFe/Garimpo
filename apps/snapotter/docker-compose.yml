# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/SnapOtter).
services:
  snapotter:
    image: snapotter/snapotter:2.2.0
    deploy:
      resources:
        reservations:
          memory: 1024M
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    - ${APP_DATA_DIR}/data/workspace:/tmp/workspace
    environment:
    - AUTH_ENABLED=true
    - DEFAULT_USERNAME=admin
    - DEFAULT_PASSWORD=admin
    - MAX_UPLOAD_SIZE_MB=0
    - MAX_BATCH_SIZE=0
    - CONCURRENT_JOBS=0
    - REDIS_MAXMEMORY=512mb
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:1349/api/v1/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    x-runtipi:
      is_main: true
      internal_port: 1349
x-runtipi:
  schema_version: 2
