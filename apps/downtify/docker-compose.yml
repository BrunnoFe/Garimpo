# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Downtify).
services:
  downtify:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: ghcr.io/henriquesebastiao/downtify:2.7.0
    deploy:
      resources:
        reservations:
          memory: 2048M
    volumes:
    - ${ROOT_FOLDER_HOST}/media/downloads/downtify:/downloads
    - ${APP_DATA_DIR}/data/data:/data
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
