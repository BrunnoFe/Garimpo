# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Tvheadend).
services:
  tvheadend:
    image: linuxserver/tvheadend:version-8837853a
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      RUN_OPTS: ''
    ports:
    - target: 9982
      published: 9982
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/recordings:/recordings
    devices:
    - /dev/dri:/dev/dri
    - /dev/dvb:/dev/dvb
    x-runtipi:
      is_main: true
      internal_port: 9981
x-runtipi:
  schema_version: 2
