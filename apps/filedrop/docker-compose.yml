# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Filedrop).
services:
  filedrop:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    image: noecl/filedrop:1.0.1
    deploy:
      resources:
        reservations:
          memory: 2048M
    volumes:
    - ${APP_DATA_DIR}/data/data:/var/file_drop_files
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
