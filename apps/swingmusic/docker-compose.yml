# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/SwingMusic).
services:
  swingmusic:
    image: ghcr.io/swingmx/swingmusic:v2.1.4
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${ROOT_FOLDER_HOST}/media/data/music:/music
    x-runtipi:
      is_main: true
      internal_port: 1970
x-runtipi:
  schema_version: 2
