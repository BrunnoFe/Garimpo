# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Nzbhydra2).
services:
  nzbhydra2:
    image: linuxserver/nzbhydra2:9.3.4
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    x-runtipi:
      is_main: true
      internal_port: 5076
x-runtipi:
  schema_version: 2
