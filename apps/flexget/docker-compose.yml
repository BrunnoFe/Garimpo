# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Flexget).
services:
  flexget:
    image: linuxserver/flexget:3.22.13
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      FG_LOG_LEVEL: ''
      FG_LOG_FILE: ''
      FG_CONFIG_FILE: ''
      FG_WEBUI_PASSWORD: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/data:/data
    x-runtipi:
      is_main: true
      internal_port: 5050
x-runtipi:
  schema_version: 2
