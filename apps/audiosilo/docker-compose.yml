# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Audiosilo).
services:
  audiosilo:
    image: linuxserver/audiosilo:2.6.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/audiobooks:ro:/audiobooks:ro
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
