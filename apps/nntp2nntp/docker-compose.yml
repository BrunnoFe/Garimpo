# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Nntp2nntp).
services:
  nntp2nntp:
    image: linuxserver/nntp2nntp:0.3.20230704
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 1563
x-runtipi:
  schema_version: 2
