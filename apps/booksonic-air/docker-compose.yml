# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Booksonic-air).
services:
  booksonic-air:
    image: linuxserver/booksonic-air:2201.1.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CONTEXT_PATH: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/audiobooks:/audiobooks
    - ${APP_DATA_DIR}/data/podcasts:/podcasts
    - ${APP_DATA_DIR}/data/othermedia:/othermedia
    x-runtipi:
      is_main: true
      internal_port: 4040
x-runtipi:
  schema_version: 2
