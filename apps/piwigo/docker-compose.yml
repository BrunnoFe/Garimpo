# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Piwigo).
services:
  piwigo:
    image: linuxserver/piwigo:16.5.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/gallery:/gallery
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
