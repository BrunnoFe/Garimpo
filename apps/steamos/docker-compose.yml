# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Steamos).
services:
  steamos:
    image: linuxserver/steamos:version-2024-12-20
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DRINODE: ''
      HOST_IP: ''
      STARTUP: ''
      RESOLUTION: ''
    ports:
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - /dev/input:/dev/input
    - /run/udev/data:/run/udev/data
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
