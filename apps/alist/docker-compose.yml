# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Alist).
services:
  alist:
    image: xhofe/alist:v3.40.0
    deploy:
      resources:
        reservations:
          memory: 64M
    volumes:
    - ${APP_DATA_DIR}/data/data:/opt/alist/data
    x-runtipi:
      is_main: true
      internal_port: 5244
x-runtipi:
  schema_version: 2
