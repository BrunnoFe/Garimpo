# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/MongoDB4).
services:
  mongodb4:
    image: mongo:4.4.22
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/data/configdb:/data/configdb
    - ${APP_DATA_DIR}/data/data/db:/data/db
    x-runtipi:
      is_main: true
      internal_port: 27017
x-runtipi:
  schema_version: 2
