# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Helium).
services:
  helium:
    image: linuxserver/helium:0.22.4
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      HELIUM_CLI: ''
    ports:
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
