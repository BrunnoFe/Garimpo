# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Sealskin).
services:
  sealskin:
    image: linuxserver/sealskin:0.4.2
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      HOST_URL: ''
    ports:
    - target: 8443
      published: 8443
      protocol: tcp
    - target: 8444
      published: 8444
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/storage:/storage
    - /var/run/docker.sock:/var/run/docker.sock
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
