# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/NginxProxyManager).
services:
  nginxproxymanager:
    image: jc21/nginx-proxy-manager:2.13.5
    deploy:
      resources:
        reservations:
          memory: 128M
    ports:
    - target: 80
      published: '80'
      protocol: tcp
    - target: 443
      published: '443'
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/data:/data
    - ${APP_DATA_DIR}/data/etc/letsencrypt:/etc/letsencrypt
    x-runtipi:
      is_main: true
      internal_port: 81
x-runtipi:
  schema_version: 2
