# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Sickchill).
services:
  sickchill:
    image: linuxserver/sickchill:2024.3.1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/tv:/tv
    x-runtipi:
      is_main: true
      internal_port: 8081
x-runtipi:
  schema_version: 2
