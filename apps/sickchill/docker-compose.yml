# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Sickchill).
services:
  sickchill:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: Europe/London
    image: linuxserver/sickchill:2023.6.27
    deploy:
      resources:
        reservations:
          memory: 64M
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${ROOT_FOLDER_HOST}/media/downloads:/downloads
    - ${ROOT_FOLDER_HOST}/media/data/tv:/tv
    x-runtipi:
      is_main: true
      internal_port: 8081
x-runtipi:
  schema_version: 2
