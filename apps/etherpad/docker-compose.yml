# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Etherpad).
services:
  etherpad:
    image: etherpad/etherpad:3.1.0
    deploy:
      resources:
        reservations:
          memory: 256M
    volumes:
    - ${APP_DATA_DIR}/data/var:/opt/etherpad-lite/var
    environment:
      TITLE: Etherpad
      DEFAULT_PAD_TEXT: |
        Welcome to Etherpad on CasaOS!

        This pad text is synchronized as you type, so that everyone viewing this page sees the same text. This allows you to collaborate seamlessly on documents!

        Get involved with Etherpad at https://etherpad.org
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTHENTICATION_METHOD: apikey
      DB_TYPE: dirty
      DB_FILENAME: /opt/etherpad-lite/var/dirty.db
      TRUST_PROXY: 'true'
      SHOW_SETTINGS_IN_ADMIN_PAGE: 'true'
      REQUIRE_AUTHENTICATION: 'false'
      REQUIRE_AUTHORIZATION: 'false'
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O-
      - http://localhost:9001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    x-runtipi:
      is_main: true
      internal_port: 9001
x-runtipi:
  schema_version: 2
