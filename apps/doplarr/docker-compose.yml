# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Doplarr).
services:
  doplarr:
    image: linuxserver/doplarr:3.8.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DISCORD__TOKEN: ''
      OVERSEERR__API: ''
      OVERSEERR__URL: ''
      RADARR__API: ''
      RADARR__URL: ''
      SONARR__API: ''
      SONARR__URL: ''
      DISCORD__MAX_RESULTS: ''
      DISCORD__REQUESTED_MSG_STYLE: ''
      SONARR__QUALITY_PROFILE: ''
      RADARR__QUALITY_PROFILE: ''
      SONARR__ROOTFOLDER: ''
      RADARR__ROOTFOLDER: ''
      SONARR__LANGUAGE_PROFILE: ''
      OVERSEERR__DEFAULT_ID: ''
      PARTIAL_SEASONS: ''
      LOG_LEVEL: ''
      JAVA_OPTS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
