# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Rdesktop).
services:
  rdesktop:
    image: linuxserver/rdesktop:arch-kde-version-arch-2025-01-10
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/data/config:/config
    shm_size: 1gb
    x-runtipi:
      is_main: true
      internal_port: 3389
x-runtipi:
  schema_version: 2
