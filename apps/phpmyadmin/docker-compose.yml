# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Phpmyadmin).
services:
  phpmyadmin:
    image: linuxserver/phpmyadmin:5.2.3
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      PMA_ARBITRARY: ''
      PMA_ABSOLUTE_URI: ''
      PMA_HOST: 172.17.0.1
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8081
x-runtipi:
  schema_version: 2
