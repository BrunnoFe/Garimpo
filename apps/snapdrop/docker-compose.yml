# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Snapdrop).
services:
  snapdrop:
    image: linuxserver/snapdrop:version-f88d46ed
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    ports:
    - target: 443
      published: 443
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
