# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/Snapdrop).
services:
  snapdrop:
    environment:
    - PGID=1000
    - PUID=1000
    - TZ=${TZ}
    image: linuxserver/snapdrop:version-eac78009
    ports:
    - target: 443
      published: '443'
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    privileged: false
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
