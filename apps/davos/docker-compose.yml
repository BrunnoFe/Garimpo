# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Davos).
services:
  davos:
    image: linuxserver/davos:2.2.2
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/download:/download
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
