# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Doplarr_rs).
services:
  doplarr-rs:
    image: linuxserver/doplarr_rs:4.6.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
