# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/oPodSync).
services:
  opodsync:
    image: ganeshlab/opodsync:latest
    deploy:
      resources:
        reservations:
          memory: 512M
    volumes:
    - ${APP_DATA_DIR}/data:/var/www/server/data
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
