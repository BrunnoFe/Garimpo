# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Ombi).
services:
  ombi:
    image: linuxserver/ombi:4.53.10
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      BASE_URL: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3579
x-runtipi:
  schema_version: 2
