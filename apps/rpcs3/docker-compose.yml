# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Rpcs3).
services:
  rpcs3:
    image: linuxserver/rpcs3:version-build-fb6737b1c8306ceeccb53b7fa051acfc9e641cd7
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    ports:
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
