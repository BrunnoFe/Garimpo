# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Openvscode-server).
services:
  openvscode-server:
    image: linuxserver/openvscode-server:1.109.5
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CONNECTION_TOKEN: ''
      CONNECTION_SECRET: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - /:/casaos
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
