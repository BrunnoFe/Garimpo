# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Snipe-it).
services:
  snipe-it:
    image: linuxserver/snipe-it:7.1.15
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      APP_KEY: ''
      APP_URL: ''
      MYSQL_PORT_3306_TCP_ADDR: ''
      MYSQL_PORT_3306_TCP_PORT: ''
      MYSQL_DATABASE: ''
      MYSQL_USER: ''
      MYSQL_PASSWORD: ''
      APP_DEBUG: ''
      APP_ENV: ''
      APP_FORCE_TLS: ''
      APP_LOCALE: ''
      MAIL_PORT_587_TCP_ADDR: ''
      MAIL_PORT_587_TCP_PORT: ''
      MAIL_ENV_FROM_ADDR: ''
      MAIL_ENV_FROM_NAME: ''
      MAIL_ENV_ENCRYPTION: ''
      MAIL_ENV_USERNAME: ''
      MAIL_ENV_PASSWORD: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
