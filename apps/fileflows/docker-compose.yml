# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/FileFlows).
services:
  fileflows:
    devices:
    - /dev/dri:/dev/dri
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: ${TZ}
    hostname: fileflows
    image: revenz/fileflows:stable
    volumes:
    - ${APP_DATA_DIR}/data/data:/app/Data
    - ${APP_DATA_DIR}/data/logs:/app/Logs
    - ${APP_DATA_DIR}/data/common:/app/common
    - ${APP_DATA_DIR}/data/temp:/temp
    - ${ROOT_FOLDER_HOST}/media/data:/Media
    - /var/run/docker.sock:/var/run/docker.sock
    x-runtipi:
      is_main: true
      internal_port: 5000
x-runtipi:
  schema_version: 2
