# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/LangFlow).
services:
  langflow:
    image: langflowai/langflow:1.9.3
    user: 0:0
    depends_on:
    - langflow-postgres
    environment:
    - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@langflow-postgres:5432/langflow
    - LANGFLOW_CONFIG_DIR=/app/langflow
    volumes:
    - ${APP_DATA_DIR}/data/backend:/app/langflow
    x-runtipi:
      is_main: true
      internal_port: 7860
  langflow-postgres:
    image: postgres:16
    environment:
    - POSTGRES_USER=langflow
    - POSTGRES_PASSWORD=langflow
    - POSTGRES_DB=langflow
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
x-runtipi:
  schema_version: 2
