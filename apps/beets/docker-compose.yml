# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Beets).
services:
  beets:
    image: linuxserver/beets:2.14.1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/music:/music
    - ${APP_DATA_DIR}/data/downloads:/downloads
    x-runtipi:
      is_main: true
      internal_port: 8337
x-runtipi:
  schema_version: 2
