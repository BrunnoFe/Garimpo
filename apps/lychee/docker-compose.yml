# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Lychee).
services:
  lychee:
    image: linuxserver/lychee:7.13.1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      DB_CONNECTION: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      APP_NAME: ''
      APP_URL: ''
      TRUSTED_PROXIES: ''
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/pictures:/pictures
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
