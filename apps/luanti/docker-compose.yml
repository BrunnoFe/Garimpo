# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Luanti).
services:
  luanti:
    image: linuxserver/luanti:5.18.0
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
      CLI_ARGS: ''
    volumes:
    - ${APP_DATA_DIR}/data/config/.minetest:/config/.minetest
    x-runtipi:
      is_main: true
      internal_port: 30000
x-runtipi:
  schema_version: 2
