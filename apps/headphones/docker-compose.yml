# Convertido pelo Garimpo do BrunOS a partir de https://github.com/WisdomSky/LinuxServer-AppStore (Apps/Headphones).
services:
  headphones:
    image: linuxserver/headphones:version-a78f38c1
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: ${TZ}
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/downloads:/downloads
    - ${APP_DATA_DIR}/data/music:/music
    x-runtipi:
      is_main: true
      internal_port: 8181
x-runtipi:
  schema_version: 2
