# Convertido pelo Garimpo do BrunOS a partir de https://github.com/IceWhaleTech/CasaOS-AppStore (Apps/JDownloader2).
services:
  jdownloader2:
    image: jlesage/jdownloader-2:latest
    environment:
    - USER_ID=1000
    - GROUP_ID=1000
    - TZ=${TZ}
    - MYJDOWNLOADER_EMAIL=$MYJDOWNLOADER_EMAIL
    - MYJDOWNLOADER_PASSWORD=$MYJDOWNLOADER_PASSWORD
    - MYJDOWNLOADER_DEVICE_NAME=$MYJDOWNLOADER_DEVICE_NAME
    - JDOWNLOADER_HEADLESS=$JDOWNLOADER_HEADLESS
    ports:
    - target: 5900
      published: '5900'
      protocol: tcp
    - target: 3129
      published: '3129'
      protocol: tcp
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${ROOT_FOLDER_HOST}/media/downloads:/output
    x-runtipi:
      is_main: true
      internal_port: 5800
x-runtipi:
  schema_version: 2
